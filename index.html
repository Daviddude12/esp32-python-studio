<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Python Studio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #0f1117;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 15px;
    background: #181b23;
    border-bottom: 1px solid #303541;
}

h1 {
    margin: 0 auto 0 0;
    font-size: 19px;
}

button {
    border: 1px solid #414756;
    background: #292e39;
    color: white;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #383e4b;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#connectButton {
    background: #2563eb;
    border-color: #3b82f6;
}

#saveButton {
    background: #15803d;
    border-color: #22c55e;
}

#runButton {
    background: #7c3aed;
    border-color: #a78bfa;
}

#stopButton {
    background: #991b1b;
    border-color: #ef4444;
    display: none;
}

.main {
    height: calc(100vh - 99px);
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.editor-area {
    flex: 1;
    min-height: 0;
    display: flex;
}

#editor {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-size: 15px;
    line-height: 1.5;
}

.CodeMirror {
    height: 100%;
    font-family: Consolas, "Courier New", monospace;
    font-size: 15px;
    line-height: 1.5;
    background: #0f1117;
}

.CodeMirror-gutters {
    background: #151820;
    border-right: 1px solid #303541;
}

.CodeMirror-linenumber {
    color: #666d7b;
}

.CodeMirror-activeline-background {
    background: rgba(255, 255, 255, 0.045);
}

.output-container {
    height: 260px;
    background: #090b0f;
    border-top: 1px solid #303541;
    display: flex;
    flex-direction: column;
    min-height: 120px;
}

.output-title {
    height: 35px;
    flex: 0 0 35px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    background: #181b23;
    color: #cbd5e1;
    font-size: 13px;
    border-bottom: 1px solid #303541;
}

#terminal {
    flex: 1;
    min-height: 0;
    padding: 8px 10px;
    overflow: hidden;
}

#terminal .xterm {
    height: 100%;
}

.status-bar {
    height: 35px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: #181b23;
    border-top: 1px solid #303541;
    color: #9ca3af;
    font-size: 12px;
}

#status.connected {
    color: #4ade80;
}

#status.error {
    color: #f87171;
}

@media (max-width: 800px) {
    header {
        gap: 5px;
        padding: 0 8px;
    }

    h1 {
        font-size: 15px;
    }

    button {
        padding: 8px 9px;
        font-size: 12px;
    }

    .output-container {
        height: 230px;
    }
}
</style>
</head>

<body>

<header>
    <h1>ESP32 Python Studio</h1>

    <button id="connectButton">Connect ESP32</button>
    <button id="loadButton">Load</button>
    <button id="saveButton">Save</button>
    <button id="runButton">Run</button>
    <button id="stopButton">Stop</button>
    <button id="downloadButton">Download</button>
    <button id="clearButton">Clear</button>
</header>

<div class="main">

    <div class="editor-area">
        <textarea id="editor"></textarea>
    </div>

    <div class="output-container">

        <div class="output-title">
            Terminal
        </div>

        <div id="terminal"></div>

    </div>

</div>

<div class="status-bar">
    <span id="status">Ready</span>
</div>


<script>
/* ======================================================
   CONFIGURATION
====================================================== */

/*
   Leave blank because the Python server serves this page.

   That means the browser automatically connects to:

       /ws/run
*/
const RUNNER_WS_URL = "";


/* ======================================================
   CODE EDITOR
====================================================== */

const editor = CodeMirror.fromTextArea(
    document.getElementById("editor"),
    {
        mode: "python",
        theme: "material-darker",

        lineNumbers: true,
        lineWrapping: false,

        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        smartIndent: true,

        autoCloseBrackets: true,
        matchBrackets: true,
        styleActiveLine: true,

        extraKeys: {

            "Tab": function(cm) {

                if (cm.somethingSelected()) {

                    cm.indentSelection("add");

                } else {

                    cm.replaceSelection("    ", "end");

                }
            },

            "Shift-Tab": function(cm) {

                cm.indentSelection("subtract");

            }
        }
    }
);


editor.setValue(
`print("Hello from ESP32 Python Studio!")
`
);


/* ======================================================
   TERMINAL
====================================================== */

const terminal = new Terminal({

    cursorBlink: true,

    convertEol: true,

    scrollback: 5000,

    fontFamily:
        'Consolas, "Courier New", monospace',

    fontSize: 14,

    theme: {

        background: "#090b0f",

        foreground: "#e6edf3",

        cursor: "#ffffff"

    }
});


terminal.open(
    document.getElementById("terminal")
);


terminal.write(
    "ESP32 Python Studio terminal\r\n"
);


let runSocket = null;
let running = false;


function terminalWrite(text) {

    terminal.write(
        text.replace(/\r?\n/g, "\r\n")
    );

}


function clearTerminal() {

    terminal.write("\x1b[2J\x1b[H");

}


terminal.onData((data) => {

    if (
        runSocket &&
        runSocket.readyState === WebSocket.OPEN
    ) {

        runSocket.send(
            JSON.stringify({
                type: "input",
                data: data
            })
        );

    }

});


function socketURL() {

    if (RUNNER_WS_URL) {

        return RUNNER_WS_URL;

    }

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return (
        protocol +
        "//" +
        location.host +
        "/ws/run"
    );

}


function sendResize() {

    if (
        runSocket &&
        runSocket.readyState === WebSocket.OPEN
    ) {

        runSocket.send(

            JSON.stringify({

                type: "resize",

                rows: terminal.rows,

                cols: terminal.cols

            })

        );

    }

}


new ResizeObserver(() => {

    sendResize();

}).observe(
    document.getElementById("terminal")
);


/* ======================================================
   STATUS
====================================================== */

const statusElement =
    document.getElementById("status");


function setStatus(
    message,
    type = ""
) {

    statusElement.textContent = message;

    statusElement.className = type;

}


/* ======================================================
   ESP32 SERIAL
====================================================== */

let port = null;
let writer = null;


async function connectESP32() {

    if (!("serial" in navigator)) {

        alert(
            "Web Serial is not supported by this browser. " +
            "Use Google Chrome or Microsoft Edge."
        );

        return;
    }


    try {

        if (
            port &&
            port.readable
        ) {

            setStatus(
                "ESP32 already connected",
                "connected"
            );

            return;
        }


        if (port) {

            try {

                await port.close();

            } catch (_) {}

            port = null;
            writer = null;

        }


        port =
            await navigator.serial.requestPort();


        await port.open({
            baudRate: 115200
        });


        writer =
            port.writable.getWriter();


        document.getElementById(
            "connectButton"
        ).textContent = "Connected";


        setStatus(
            "ESP32 connected",
            "connected"
        );

    } catch (error) {

        console.error(error);

        writer = null;

        port = null;

        document.getElementById(
            "connectButton"
        ).textContent = "Connect ESP32";


        setStatus(
            "Connection failed",
            "error"
        );

    }

}


async function writeSerial(data) {

    if (!writer) {

        throw new Error(
            "ESP32 is not connected."
        );

    }


    await writer.write(
        new TextEncoder().encode(data)
    );

}


async function sendAndWaitFor(
    command,
    marker,
    timeout = 5000
) {

    if (
        !port ||
        !writer ||
        !port.readable
    ) {

        throw new Error(
            "ESP32 is not connected."
        );

    }


    const reader =
        port.readable.getReader();


    const decoder =
        new TextDecoder();


    let response = "";

    let timer;


    try {

        const readPromise =
            (async () => {

                while (true) {

                    const result =
                        await reader.read();


                    if (result.done) {

                        break;

                    }


                    response +=
                        decoder.decode(
                            result.value,
                            {
                                stream: true
                            }
                        );


                    if (
                        response.includes(marker)
                    ) {

                        break;

                    }

                }


                return response;

            })();


        const timeoutPromise =
            new Promise(
                (_, reject) => {

                    timer = setTimeout(
                        () => reject(
                            new Error(
                                "Timed out waiting for ESP32 response: " +
                                marker
                            )
                        ),
                        timeout
                    );

                }
            );


        await writeSerial(
            command + "\n"
        );


        return await Promise.race([
            readPromise,
            timeoutPromise
        ]);

    } finally {

        clearTimeout(timer);

        reader.releaseLock();

    }

}


async function saveToESP() {

    if (
        !writer ||
        !port
    ) {

        alert(
            "Connect the ESP32 first."
        );

        return;
    }


    try {

        const code =
            editor.getValue();


        const ready =
            await sendAndWaitFor(
                "SAVE",
                "READY",
                5000
            );


        if (!ready.includes("READY")) {

            throw new Error(
                "ESP32 did not enter save mode."
            );

        }


        const saved =
            await sendAndWaitFor(

                code +
                "\n__END_OF_FILE__\n",

                "SAVE_OK",

                10000

            );


        if (!saved.includes("SAVE_OK")) {

            throw new Error(
                "ESP32 did not confirm the file was saved."
            );

        }


        setStatus(
            "Saved main.py to ESP32",
            "connected"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "Save failed: " +
            error.message,
            "error"
        );

    }

}


async function loadFromESP() {

    if (
        !writer ||
        !port
    ) {

        alert(
            "Connect the ESP32 first."
        );

        return;
    }


    try {

        const response =
            await sendAndWaitFor(
                "GET",
                "PYTHON_END",
                10000
            );


        const start =
            response.indexOf(
                "PYTHON_START"
            );


        const end =
            response.indexOf(
                "PYTHON_END"
            );


        if (
            start === -1 ||
            end === -1 ||
            end < start
        ) {

            throw new Error(
                "No valid main.py response was received."
            );

        }


        let code =
            response.substring(
                start +
                "PYTHON_START".length,
                end
            );


        code =
            code.replace(
                /^\r?\n/,
                ""
            );


        editor.setValue(code);

        editor.focus();


        setStatus(
            "Loaded main.py from ESP32",
            "connected"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "Load failed: " +
            error.message,
            "error"
        );

    }

}


/* ======================================================
   PYTHON RUNNER
====================================================== */

function setRunning(value) {

    running = value;


    document.getElementById(
        "runButton"
    ).disabled = value;


    document.getElementById(
        "stopButton"
    ).style.display =
        value
            ? "inline-block"
            : "none";

}


function runPython() {

    if (running) {

        return;

    }


    clearTerminal();


    terminal.write(
        "Running...\r\n"
    );


    setRunning(true);


    setStatus(
        "Running Python...",
        "connected"
    );


    const url =
        socketURL();


    runSocket =
        new WebSocket(url);


    runSocket.onopen = () => {

        runSocket.send(

            JSON.stringify({

                type: "run",

                code: editor.getValue()

            })

        );


        sendResize();


        terminal.focus();

    };


    runSocket.onmessage = (event) => {

        try {

            const message =
                JSON.parse(event.data);


            if (
                message.type === "output"
            ) {

                /*
                   xterm receives the real terminal
                   data, including ANSI escape codes.
                */
                terminal.write(
                    message.data
                );

            }


            else if (
                message.type === "error"
            ) {

                terminalWrite(
                    "\r\n" +
                    message.message +
                    "\r\n"
                );

            }


            else if (
                message.type === "exit"
            ) {

                terminalWrite(
                    "\r\n[process exited with code " +
                    message.code +
                    "]\r\n"
                );


                setRunning(false);


                setStatus(
                    "Python finished",
                    "connected"
                );


                runSocket.close();

                runSocket = null;

            }

        } catch (error) {

            console.error(error);

        }

    };


    runSocket.onerror = () => {

        terminalWrite(
            "\r\n[Could not connect to Python runner]\r\n"
        );


        setRunning(false);


        setStatus(
            "Python runner connection failed",
            "error"
        );

    };


    runSocket.onclose = () => {

        if (running) {

            setRunning(false);

            setStatus(
                "Python runner disconnected",
                "error"
            );

        }


        runSocket = null;

    };

}


function stopPython() {

    if (
        runSocket &&
        runSocket.readyState === WebSocket.OPEN
    ) {

        runSocket.send(

            JSON.stringify({
                type: "stop"
            })

        );


        terminalWrite(
            "\r\n[stopping...]\r\n"
        );

    }

}


/* ======================================================
   DOWNLOAD / CLEAR
====================================================== */

function downloadPython() {

    const blob =
        new Blob(
            [
                editor.getValue()
            ],
            {
                type: "text/x-python"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download = "main.py";

    a.click();


    URL.revokeObjectURL(url);

}


function clearEditor() {

    editor.setValue("");

    editor.focus();

}


/* ======================================================
   BUTTONS
====================================================== */

document.getElementById(
    "connectButton"
).onclick = connectESP32;


document.getElementById(
    "loadButton"
).onclick = loadFromESP;


document.getElementById(
    "saveButton"
).onclick = saveToESP;


document.getElementById(
    "runButton"
).onclick = runPython;


document.getElementById(
    "stopButton"
).onclick = stopPython;


document.getElementById(
    "downloadButton"
).onclick = downloadPython;


document.getElementById(
    "clearButton"
).onclick = clearEditor;


window.addEventListener(
    "beforeunload",
    () => {

        if (
            runSocket &&
            runSocket.readyState === WebSocket.OPEN
        ) {

            try {

                runSocket.send(
                    JSON.stringify({
                        type: "stop"
                    })
                );

            } catch (_) {}

        }

    }
);

</script>

</body>
</html>
