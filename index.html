<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 Python Studio</title>

<!-- Python running inside the browser -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>

<!-- Terminal emulator -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.css"
>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.js">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;

    background: #0f1117;
    color: white;

    font-family: Arial, sans-serif;
}


/* ================================
   TOP BAR
================================ */

header {
    height: 64px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 0 15px;

    background: #181b23;

    border-bottom: 1px solid #303541;
}

h1 {
    margin: 0;
    margin-right: auto;

    font-size: 19px;
}

button {
    border: 1px solid #414756;

    background: #292e39;

    color: white;

    padding: 9px 14px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;
}

button:hover {
    background: #383e4b;
}

#connectButton {
    background: #2563eb;
    border-color: #3b82f6;
}

#saveButton {
    background: #15803d;
    border-color: #22c55e;
}

#runButton {
    background: #7c3aed;
    border-color: #a78bfa;
}

#stopButton {
    background: #991b1b;
    border-color: #ef4444;

    display: none;
}


/* ================================
   MAIN
================================ */

.main {
    height: calc(100vh - 99px);

    display: flex;

    flex-direction: column;

    min-height: 0;
}


/* ================================
   EDITOR
================================ */

.editor-area {
    flex: 1;

    min-height: 0;

    display: flex;
}

#lineNumbers {
    width: 55px;

    padding-top: 15px;
    padding-right: 10px;

    background: #151820;

    color: #666d7b;

    text-align: right;

    font-family: Consolas, monospace;

    font-size: 15px;

    line-height: 1.5;

    overflow: hidden;

    user-select: none;
}

#editor {
    flex: 1;

    resize: none;

    border: none;

    outline: none;

    padding: 15px;

    background: #0f1117;

    color: #e6edf3;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 15px;

    line-height: 1.5;

    tab-size: 4;

    white-space: pre;

    overflow: auto;
}


/* ================================
   OUTPUT TERMINAL
================================ */

.output-container {
    height: 220px;

    background: #090b0f;

    border-top: 1px solid #303541;

    display: flex;

    flex-direction: column;
}

.output-title {
    height: 35px;

    display: flex;

    align-items: center;

    padding: 0 15px;

    background: #181b23;

    color: #cbd5e1;

    font-size: 13px;

    border-bottom: 1px solid #303541;
}

#terminal {
    flex: 1;

    min-height: 0;

    padding: 8px 10px;

    overflow: hidden;
}

#terminal .xterm {
    height: 100%;
}

#terminal .xterm-viewport {
    overflow-y: auto !important;
}


/* ================================
   STATUS
================================ */

.status-bar {
    height: 35px;

    display: flex;

    align-items: center;

    padding: 0 15px;

    background: #181b23;

    border-top: 1px solid #303541;

    font-size: 13px;
}

.connected {
    color: #4ade80;
}

.error {
    color: #f87171;
}

.normal {
    color: #9ca3af;
}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header>

<h1>
🐍 ESP32 Python Studio
</h1>


<button id="connectButton">
Connect ESP32
</button>


<button id="loadButton">
Load
</button>


<button id="saveButton">
Save
</button>


<button id="runButton">
▶ Run
</button>


<button id="stopButton">
■ Stop
</button>


<button id="downloadButton">
Download
</button>


<button id="clearButton">
Clear
</button>

</header>


<!-- ================================
     MAIN
================================ -->

<div class="main">


<div class="editor-area">


<div id="lineNumbers">
1
</div>


<textarea
id="editor"
spellcheck="false"
placeholder="Write Python here..."
></textarea>


</div>


<div class="output-container">


<div class="output-title">
OUTPUT
</div>


<div
    id="terminal"
    aria-label="Python terminal">
</div>


</div>


</div>


<!-- ================================
     STATUS BAR
================================ -->

<div class="status-bar">

<span
id="status"
class="normal">
Not connected
</span>

</div>


<script>


/* ======================================================
   ESP32 VARIABLES
====================================================== */

let port = null;

let writer = null;


/* ======================================================
   PYTHON VARIABLES
====================================================== */

let pyodide = null;

let pyodideLoading = false;


/* ======================================================
   HTML ELEMENTS
====================================================== */

const editor =
    document.getElementById(
        "editor"
    );


const lineNumbers =
    document.getElementById(
        "lineNumbers"
    );


const terminalElement =
    document.getElementById(
        "terminal"
    );


/* ======================================================
   TERMINAL
====================================================== */

const terminal =
    new Terminal({

        convertEol: true,

        cursorBlink: true,

        scrollback: 5000,

        fontFamily:
            'Consolas, "Courier New", monospace',

        fontSize: 14,

        theme: {

            background: "#090b0f",

            foreground: "#d1d5db",

            cursor: "#e6edf3",

            selectionBackground: "#334155"
        }
    });


terminal.open(
    terminalElement
);


const status =
    document.getElementById(
        "status"
    );


const connectButton =
    document.getElementById(
        "connectButton"
    );


const loadButton =
    document.getElementById(
        "loadButton"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const runButton =
    document.getElementById(
        "runButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const clearButton =
    document.getElementById(
        "clearButton"
    );


/* ======================================================
   STATUS
====================================================== */

function setStatus(
    message,
    type = "normal"
) {

    status.textContent =
        message;

    status.className =
        type;
}


/* ======================================================
   LINE NUMBERS
====================================================== */

function updateLineNumbers() {

    const count =
        editor.value.split(
            "\n"
        ).length;


    let numbers = "";


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        numbers +=
            i + "\n";
    }


    lineNumbers.textContent =
        numbers;
}


editor.addEventListener(
    "input",
    updateLineNumbers
);


/* ======================================================
   TAB KEY
====================================================== */

editor.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Tab"
        ) {

            event.preventDefault();

            const start =
                editor.selectionStart;

            const end =
                editor.selectionEnd;

            editor.value =
                editor.value.substring(
                    0,
                    start
                ) +
                "    " +
                editor.value.substring(
                    end
                );

            editor.selectionStart =
                start + 4;

            editor.selectionEnd =
                start + 4;

            updateLineNumbers();
        }
    }
);


/* ======================================================
   CONNECT ESP32
====================================================== */

async function connectESP32() {

    if (!("serial" in navigator)) {

        alert(
            "Web Serial is not supported by this browser.\n\n" +
            "Use Google Chrome or Microsoft Edge."
        );

        return;
    }


    try {

        if (
            port &&
            port.readable
        ) {

            setStatus(
                "ESP32 already connected",
                "connected"
            );

            return;
        }


        port =
            await navigator.serial.requestPort();


        await port.open({
            baudRate: 115200
        });


        writer =
            port.writable.getWriter();


        connectButton.textContent =
            "Connected";


        setStatus(
            "ESP32 connected",
            "connected"
        );


    } catch (error) {

        console.error(
            error
        );

        writer = null;

        port = null;

        connectButton.textContent =
            "Connect ESP32";


        setStatus(
            "Connection failed",
            "error"
        );
    }
}


/* ======================================================
   SERIAL HELPERS
====================================================== */

async function writeSerial(
    data
) {

    if (!writer) {

        throw new Error(
            "ESP32 is not connected."
        );
    }


    await writer.write(
        new TextEncoder().encode(
            data
        )
    );
}


async function sendAndWaitFor(
    command,
    marker,
    timeout = 5000
) {

    if (
        !port ||
        !writer ||
        !port.readable
    ) {

        throw new Error(
            "ESP32 is not connected."
        );
    }


    const reader =
        port.readable.getReader();


    const decoder =
        new TextDecoder();


    let response =
        "";


    let timer;


    try {

        const readPromise =
            (async () => {

                while (true) {

                    const result =
                        await reader.read();


                    if (
                        result.done
                    ) {

                        break;
                    }


                    response +=
                        decoder.decode(
                            result.value,
                            {
                                stream: true
                            }
                        );


                    if (
                        response.includes(
                            marker
                        )
                    ) {

                        break;
                    }
                }


                return response;
            })();


        const timeoutPromise =
            new Promise(
                (_, reject) => {

                    timer =
                        setTimeout(
                            () => {

                                reject(
                                    new Error(
                                        "Timed out waiting for ESP32 response: " +
                                        marker
                                    )
                                );

                            },
                            timeout
                        );
                }
            );


        await writeSerial(
            command + "\n"
        );


        return await Promise.race([
            readPromise,
            timeoutPromise
        ]);


    } finally {

        clearTimeout(
            timer
        );

        reader.releaseLock();
    }
}


/* ======================================================
   SAVE TO ESP32
====================================================== */

async function saveToESP() {

    if (
        !writer ||
        !port
    ) {

        alert(
            "Connect the ESP32 first."
        );

        return;
    }


    try {

        const code =
            editor.value;


        const responsePromise =
            sendAndWaitFor(
                "SAVE",
                "READY",
                5000
            );


        const readyResponse =
            await responsePromise;


        if (
            !readyResponse.includes(
                "READY"
            )
        ) {

            throw new Error(
                "ESP32 did not enter save mode."
            );
        }


        const saveResponsePromise =
            sendAndWaitFor(
                code +
                "\n__END_OF_FILE__\n",
                "SAVE_OK",
                10000
            );


        const saveResponse =
            await saveResponsePromise;


        if (
            !saveResponse.includes(
                "SAVE_OK"
            )
        ) {

            throw new Error(
                "ESP32 did not confirm the file was saved."
            );
        }


        setStatus(
            "Saved main.py to ESP32",
            "connected"
        );


    } catch (error) {

        console.error(
            error
        );


        setStatus(
            "Save failed: " +
            error.message,
            "error"
        );
    }
}


/* ======================================================
   LOAD FROM ESP32
====================================================== */

async function loadFromESP() {

    if (
        !writer ||
        !port
    ) {

        alert(
            "Connect the ESP32 first."
        );

        return;
    }


    try {

        const response =
            await sendAndWaitFor(
                "GET",
                "PYTHON_END",
                10000
            );


        const start =
            response.indexOf(
                "PYTHON_START"
            );


        const end =
            response.indexOf(
                "PYTHON_END"
            );


        if (
            start === -1 ||
            end === -1 ||
            end < start
        ) {

            throw new Error(
                "No valid main.py response was received."
            );
        }


        let code =
            response.substring(
                start +
                "PYTHON_START".length,
                end
            );


        code =
            code.replace(
                /^\r?\n/,
                ""
            );


        editor.value =
            code;


        updateLineNumbers();


        setStatus(
            "Loaded main.py from ESP32",
            "connected"
        );


    } catch (error) {

        console.error(
            error
        );


        setStatus(
            "Load failed: " +
            error.message,
            "error"
        );
    }
}


/* ======================================================
   TERMINAL HELPERS
====================================================== */

function clearTerminal() {

    terminal.clear();

    terminal.reset();
}


function writeTerminal(
    text
) {

    terminal.write(
        text
    );

    terminal.scrollToBottom();
}


/* ======================================================
   LOAD PYTHON
====================================================== */

async function startPython() {

    if (pyodide) {

        return true;
    }


    if (pyodideLoading) {

        return false;
    }


    pyodideLoading =
        true;


    clearTerminal();


    writeTerminal(
        "Loading Python...\r\n"
    );


    setStatus(
        "Loading Python...",
        "normal"
    );


    try {

        pyodide =
            await loadPyodide();


        /*
         * Send raw stdout directly
         * into the terminal.
         */
        pyodide.setStdout({

            raw: function(byte) {

                terminal.write(
                    String.fromCharCode(
                        byte
                    )
                );
            },

            isatty: true,

            getTerminalSize:
                function() {

                    return {

                        columns:
                            terminal.cols,

                        rows:
                            terminal.rows
                    };
                }
        });


        /*
         * Send raw stderr directly
         * into the terminal.
         */
        pyodide.setStderr({

            raw: function(byte) {

                terminal.write(
                    String.fromCharCode(
                        byte
                    )
                );
            },

            isatty: true,

            getTerminalSize:
                function() {

                    return {

                        columns:
                            terminal.cols,

                        rows:
                            terminal.rows
                    };
                }
        });


        terminal.writeln(
            "Python ready!"
        );


        pyodideLoading =
            false;


        setStatus(
            "Python ready",
            "connected"
        );


        return true;


    } catch (error) {

        clearTerminal();


        terminal.writeln(
            "Could not load Python:"
        );


        terminal.writeln(
            ""
        );


        writeTerminal(
            String(error) +
            "\r\n"
        );


        setStatus(
            "Python failed to load",
            "error"
        );


        pyodideLoading =
            false;


        return false;
    }
}


/* ======================================================
   RUN PYTHON
====================================================== */

async function runPython() {

    const code =
        editor.value;


    if (!code.trim()) {

        clearTerminal();


        terminal.writeln(
            "Nothing to run."
        );


        return;
    }


    clearTerminal();


    setStatus(
        "Starting Python...",
        "normal"
    );


    const ready =
        await startPython();


    if (!ready) {

        return;
    }


    try {

        /*
         * Automatically load compatible
         * Pyodide packages referenced by
         * imports.
         */
        if (
            typeof
            pyodide.loadPackagesFromImports
            === "function"
        ) {

            await
                pyodide.loadPackagesFromImports(
                    code
                );
        }


        await
            pyodide.runPythonAsync(
                code
            );


        setStatus(
            "Python finished",
            "connected"
        );


    } catch (error) {

        terminal.writeln(
            ""
        );


        writeTerminal(
            error.toString() +
            "\r\n"
        );


        setStatus(
            "Python error",
            "error"
        );
    }
}


/* ======================================================
   DOWNLOAD MAIN.PY
====================================================== */

function downloadPython() {

    const blob =
        new Blob(
            [
                editor.value
            ],
            {
                type:
                    "text/plain"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "main.py";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    setStatus(
        "Downloaded main.py"
    );
}


/* ======================================================
   CLEAR
====================================================== */

function clearEditor() {

    if (
        !confirm(
            "Clear the editor?"
        )
    ) {

        return;
    }


    editor.value =
        "";


    clearTerminal();


    updateLineNumbers();


    setStatus(
        "Editor cleared"
    );
}


/* ======================================================
   BUTTONS
====================================================== */

connectButton.onclick =
    connectESP32;


loadButton.onclick =
    loadFromESP;


saveButton.onclick =
    saveToESP;


runButton.onclick =
    runPython;


downloadButton.onclick =
    downloadPython;


clearButton.onclick =
    clearEditor;


/* ======================================================
   START
====================================================== */

updateLineNumbers();

</script>

</body>

</html>
